<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <title>Catálogo - LisoFlix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho-principal">
      <div class="logo-marca">LisoFlix</div>
      <nav class="menu-navegacao">
        <ul class="lista-links">
          <li><a href="index.html" class="link-menu">Início</a></li>
          <li><a href="catalogo.html" class="link-menu">Catálogo</a></li>
          <li><a href="planos.html" class="link-menu">Planos</a></li>
          <li><a href="suporte.html" class="link-menu">Suporte</a></li>
        </ul>
      </nav>
    </header>

    <main class="conteudo-principal">

      <section class="secao-busca">
        <h1 class="titulo-pagina">Catálogo de Filmes e Séries</h1>
        <input type="text" id="campo-busca" class="input-pesquisa" placeholder="Digite o nome do filme...">
      </section>

      <section class="secao-catalogo">
        <div id="lista-filmes" class="grade-filmes">
          <div class="card-filme">
            <img src="imagens/filme1.jpg" alt="Capa Seven" class="capa-filme">
            <h3 class="titulo-filme">Seven</h3>
            <p class="genero-filme">
              Crime / Mistério / Thriller
            </p>
            <a href="https://www.imdb.com/pt/title/tt0114369/" target="_blank" rel="noopener noreferrer" class="botao-detalhes">Ver Detalhes</a>
            <button type="<button" class="botao-lista" onclick="alternativeLista(this)">+ Minha Lista</button>
          </div>

        <div class="card-filme">
          <img src="imagens/filme2.jpg" alt="Capa Cidade de Deus" class="capa-filme">
          <h3 class="titulo-filme">Cidade de Deus</h3>
          <p class="genero-filme">
            Drama / Policial
          </p>
          <a href="https://www.imdb.com/pt/title/tt0317248/" target="_blank" rel="noopener noreferrer" class="botao-detalhes">Ver Detalhes</a>
          <button type="button" class="botao-lista" onclick="alternativeLista(this)">+ Minha Lista</button>
        </div>

        <div class="card-filme">
          <img src="imagens/filme3.jpg" alt="Capa Breaking Bad" class="capa-filme">
          <h3 class="titulo-filme">Breaking Bad</h3>
          <p class="genero-filme">
            Drama Criminal / Suspense
          </p>
          <a href="detalhes.html" class="botao-detalhes">Ver Detalhes</a>
          <button type="button" class="botao-lista" onclick="alternativeLista(this)">+ Minha Lista</button>
        </div>
        </div>
      </section>

    </main>

    <footer class="rodape-principal">
      <p class="texto-rodape">LisoFlix 2026 - Projeto Acadêmico de Programação</p> 
    </footer>
    <script src="script.js"></script>
</body> 
</html>
